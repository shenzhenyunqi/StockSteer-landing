  <line x1="758" y1="156" x2="1102" y2="156" stroke="#D1DCDD"/>

  <rect x="758" y="176" width="94" height="22" rx="5" fill="#005F63"/>
  <text x="768" y="191" fill="#F3F8F9" font-size="11" font-family="Menlo" letter-spacing="0.7">MOVE STOCK</text>

  <text fill="#1A292E" font-size="18" font-weight="700" letter-spacing="-0.3">
