    <tspan x="758" y="254">to FBA by Aug 22</tspan>
  </text>

  <text x="758" y="300" fill="#485C61" font-size="13.5">Shopify</text>
  <rect x="848" y="293" width="172" height="8" rx="4" fill="#E6EFF0"/>
  <rect x="848" y="293" width="158" height="8" rx="4" fill="#005F63"/>
  <text x="1102" y="300" fill="#1A292E" font-size="13" font-family="Menlo" text-anchor="end">64 d</text>

  <text x="758" y="328" fill="#485C61" font-size="13.5">Amazon FBA</text>
  <rect x="848" y="321" width="172" height="8" rx="4" fill="#E6EFF0"/>
  <rect x="848" y="321" width="24" height="8" rx="4" fill="#944E12"/>
  <text x="1102" y="328" fill="#1A292E" font-size="13" font-family="Menlo" text-anchor="end">9 d</text>

  <line x1="758" y1="360" x2="1102" y2="360" stroke="#D1DCDD"/>

  <rect x="758" y="380" width="112" height="22" rx="5" fill="#944E12"/>
  <text x="768" y="395" fill="#F3F8F9" font-size="11" font-family="Menlo" letter-spacing="0.7">OVERSELL RISK</text>

