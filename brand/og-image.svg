  <!-- headline -->
  <text fill="#EEF5F5" font-size="44" font-weight="700" letter-spacing="-0.9">
    <tspan x="76" y="222">Your stock sells on two</tspan>
    <tspan x="76" y="278">channels. Your planning tool</tspan>
    <tspan x="76" y="334">sees one.</tspan>
  </text>

  <!-- sub -->
  <text fill="#A8C4C5" font-size="21" letter-spacing="-0.1">
    <tspan x="76" y="388">Reads Shopify and Amazon together, then says which</tspan>
    <tspan x="76" y="416">channel should get how many units — with the math shown.</tspan>
  </text>

  <!-- offer -->
  <rect x="76" y="494" width="12" height="12" fill="#D08440" transform="rotate(-6 82 500)"/>
  <text x="102" y="505" fill="#A8C4C5" font-size="18" font-family="Menlo" letter-spacing="0.2">Free allocation diagnosis in 48 hours</text>

  <!-- specimen card -->
  <g filter="url(#cardShadow)">
    <rect x="736" y="100" width="388" height="424" rx="16" fill="#F3F8F9" stroke="#D1DCDD"/>
  </g>

  <text x="758" y="140" fill="#1A292E" font-size="16" font-weight="700" letter-spacing="-0.2">Allocation diagnosis</text>
